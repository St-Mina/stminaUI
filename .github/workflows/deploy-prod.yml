name: Deploy Main to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write environment files from secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p src/environments

          cat > src/environments/environment.ts <<EOF
          export const environment = {
            production: true,
            youtubeApiKey: '${YOUTUBE_API_KEY}',
            youtubeChannelId: 'UCFHaOwm2upL2fydLiIRsVzg',
            youtubeChannelHandle: 'StMinaNashville'
          };
          EOF

          cp src/environments/environment.ts src/environments/environment.development.ts

      - name: Build Angular site
        run: npm run build -- --configuration production --base-href=/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages files
        run: |
          mkdir -p pages-output

          if [ -d "dist/stminaUI/browser" ]; then
            cp -r dist/stminaUI/browser/. pages-output/
          elif [ -d "dist/stmina-ui/browser" ]; then
            cp -r dist/stmina-ui/browser/. pages-output/
          elif [ -d "dist/browser" ]; then
            cp -r dist/browser/. pages-output/
          else
            BUILD_DIR=$(find dist -type f -name "index.html" -printf '%h\n' | head -n 1)

            if [ -z "$BUILD_DIR" ]; then
              echo "Could not find Angular build output."
              find dist -maxdepth 4 -type f
              exit 1
            fi

            echo "Using Angular build directory: $BUILD_DIR"
            cp -r "$BUILD_DIR"/. pages-output/
          fi

          cp pages-output/index.html pages-output/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-output

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
